#
# 基于 P3TERX/Actions-OpenWrt 模板改造
# X86_64 · Lean's OpenWrt(master) · 版本标识 25.12.2 · IPv4-only · 自定义插件集
#
name: OpenWrt Builder X86

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        if [ -f "$FEEDS_CONF" ]; then mv "$FEEDS_CONF" openwrt/feeds.conf.default; fi
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        if [ -d files ]; then mv files openwrt/files; fi
        if [ -f "$CONFIG_FILE" ]; then mv "$CONFIG_FILE" openwrt/.config; fi
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Verify configuration
      run: |
        cd openwrt
        make defconfig
        echo "==== Target ===="
        grep -E '^CONFIG_TARGET_(x86|x86_64)' .config || true
        echo "==== Version ===="
        grep '^CONFIG_VERSION_NUMBER' .config || true
        grep -q '^CONFIG_TARGET_x86_64=y' .config || { echo "::error::未选中 x86_64 目标"; exit 1; }
        # 内核 IPv6 必须保持 y：6.18 的 kmod-nft-core 打包需要
        # net/ipv6/netfilter/nft_reject_ipv6.ko。IPv4 单栈靠运行时禁用实现。
        grep -q '^CONFIG_IPV6=y' .config \
          || echo "::warning::内核 CONFIG_IPV6 未启用，kmod-nft-core 打包可能失败"
        if [ -f package/base-files/files/etc/sysctl.d/99-ipv4-only.conf ]; then
          echo "OK  IPv4 单栈（运行时 disable_ipv6 已写入）"
        else
          echo "::error::缺少 99-ipv4-only.conf，默认网络不会是纯 IPv4"
          exit 1
        fi
        # 6.18 内核补丁自检：不用等两小时编译就能确认 libsha1 修复已生效
        if grep -q 'lib/crypto/libsha1.ko@ge6.18' package/kernel/linux/modules/crypto.mk; then
          echo "OK  crypto.mk libsha1 补丁已生效"
        else
          echo "::error::crypto.mk 未检测到 libsha1 补丁，kmod-crypto-sha1 打包必定失败"
          exit 1
        fi
        for p in luci-app-run luci-app-quickfile quickfile luci-theme-aurora \
                 luci-app-partexp luci-app-passwall2 clashoo luci-app-clashoo \
                 luci-app-dockerman luci-app-diskman luci-theme-argon luci-theme-vantage; do
          if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
            echo "OK  $p"
          else
            echo "::warning::${p} 未被选中（包名或源码可能有问题）"
            grep -E "^(# )?CONFIG_PACKAGE_${p}" .config \
              || echo "  .config 中无该符号（包未被 metadata 识别）"
            if [ -f "package/${p}/Makefile" ]; then
              grep -nE '^[[:space:]]*(LUCI_)?DEPENDS' "package/${p}/Makefile" | head -4 \
                || echo "  Makefile 中无 DEPENDS 行"
            fi
          fi
        done

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        set +e
        make -j$(nproc) 2>&1 | tee /tmp/build-j.log
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          echo "::warning::并行编译失败 (exit $rc)，改用单线程重试"
          make -j1 V=s 2>&1 | tee /tmp/build-1.log
          rc=${PIPESTATUS[0]}
        fi
        if [ "$rc" -ne 0 ]; then
          log=/tmp/build-1.log
          [ -s "$log" ] || log=/tmp/build-j.log
          echo "==== 编译失败：磁盘空间 ===="
          df -hT
          echo "==== 编译失败：错误行（最后 40 条） ===="
          grep -nE "make(\[[0-9]+\])?: \*\*\*|Error [0-9]+|error:|fatal error:|No space left on device|missing dependencies|undefined reference|failed to build|ERROR:" "$log" | tail -40
          echo "==== 编译失败：日志末尾 60 行 ===="
          tail -60 "$log"
          echo "==== 以下诊断行同步写入 annotations ===="
          {
            grep -nE "make(\[[0-9]+\])?: \*\*\*|Error [0-9]+|error:|fatal error:|No space left on device|missing dependencies|failed to build|ERROR:" "$log" | tail -20
            df -hT | tail -3
          } | while IFS= read -r line; do
            line=${line//%/%25}
            line=${line//$'\r'/}
            echo "::error::$line"
          done
          exit "$rc"
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_x86_64" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 调试期先禁用：失败记录被自动删除会妨碍排查
    # - name: Delete workflow runs
    #   uses: Mattraks/delete-workflow-runs@main
    #   with:
    #     retain_days: 0
    #     keep_minimum_runs: 2
    #
